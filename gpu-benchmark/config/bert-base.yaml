# BERT-Base Configuration for GPU Benchmark
# Standard configuration for baseline testing

model:
  name: "bert-base-uncased"
  type: "bert"
  vocab_size: 30522
  hidden_size: 768
  num_hidden_layers: 12
  num_attention_heads: 12
  intermediate_size: 3072
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  max_position_embeddings: 512
  type_vocab_size: 2

benchmark:
  batch_sizes: [8, 16, 32, 64]
  sequence_lengths: [128, 256, 384, 512]
  precisions: ["fp32", "fp16"]  # fp32, fp16, int8
  num_warmup_steps: 100
  num_bench_steps: 1000
  num_iterations: 3
  
device:
  device_type: "cuda"
  device_id: 0
  
profiling:
  collect_gpu_metrics: true
  profile_memory: true
  profile_flops: true
  enable_cudnn_benchmark: true
  
output:
  output_dir: "./results"
  save_csv: true
  save_html: true
  save_json: true
  log_level: "INFO"
  verbose: true
