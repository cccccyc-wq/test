# BERT-Large Configuration for GPU Benchmark
# High-performance configuration for stress testing

model:
  name: "bert-large-uncased"
  type: "bert"
  vocab_size: 30522
  hidden_size: 1024
  num_hidden_layers: 24
  num_attention_heads: 16
  intermediate_size: 4096
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  max_position_embeddings: 512
  type_vocab_size: 2
  gradient_checkpointing: true

benchmark:
  batch_sizes: [4, 8, 16, 32, 48]
  sequence_lengths: [128, 256, 384, 512]
  precisions: ["fp32", "fp16"]  # fp32, fp16, int8
  num_warmup_steps: 100
  num_bench_steps: 1000
  num_iterations: 3
  
device:
  device_type: "cuda"
  device_id: 0
  enable_multi_gpu: false
  
profiling:
  collect_gpu_metrics: true
  profile_memory: true
  profile_flops: true
  enable_cudnn_benchmark: true
  enable_tf32: true
  
optimization:
  gradient_accumulation_steps: 1
  mixed_precision: "fp16"
  
output:
  output_dir: "./results"
  save_csv: true
  save_html: true
  save_json: true
  log_level: "INFO"
  verbose: true
